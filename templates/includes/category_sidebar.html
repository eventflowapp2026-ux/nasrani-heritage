{% load static %}
{% load cache %}

<div class="card mb-4">
    <div class="card-header bg-heritage text-white">
        <h5 class="mb-0">
            <i class="fas fa-folder-open me-2"></i>Categories
        </h5>
    </div>
    <div class="card-body">
        <ul class="list-unstyled mb-0">
            {% for category in categories %}
            <li class="mb-2">
                <a href="{% url 'home' %}?category={{ category.slug }}" 
                   class="text-decoration-none d-flex justify-content-between align-items-center">
                    <span>
                        <span class="category-color" style="background-color: {{ category.color|default:'#800000' }};"></span>
                        {{ category.name }}
                    </span>
                    <span class="badge bg-secondary rounded-pill">{{ category.posts.count }}</span>
                </a>
            </li>
            {% empty %}
            <li class="text-muted">No categories yet</li>
            {% endfor %}
        </ul>
    </div>
</div>

<style>
.category-color {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 8px;
}

.category-color:hover {
    transform: scale(1.2);
    transition: transform 0.2s ease;
}

.bg-heritage {
    background-color: #800000 !important;
}
</style>
