{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile - Nasrani Heritage{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card fade-in">
                <div class="card-header bg-heritage text-white">
                    <h4 class="mb-0"><i class="fas fa-user-cog me-2"></i>Edit Profile</h4>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="text-center mb-4">
                            {% if user.profile.profile_picture %}
                            <img src="{{ user.profile.profile_picture.url }}" 
                                 alt="Current Profile Picture" 
                                 class="rounded-circle mb-3" 
                                 style="width: 150px; height: 150px; object-fit: cover;">
                            {% endif %}
                        </div>
                        
                        {{ form|crispy }}
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-heritage">
                                <i class="fas fa-save me-2"></i>Save Changes
                            </button>
                            <a href="{% url 'profile' user.username %}" class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
